name: CPU checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Public source boundary (CPU-only, stdlib)
        run: python3 tools/check_release_tree.py --root .

  runtime-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out the reviewed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest available Xcode and show the toolchain
        run: |
          set -eux
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          swift --version
      - name: Build the checked runtime (CPU-only; no MLX, Metal, or model)
        run: swift build --package-path runtime -c release
